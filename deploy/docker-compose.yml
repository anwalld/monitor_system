# Manager 侧服务编排：Redis、MySQL、manager；ai、nginx 在后续里程碑加入。
# 用法：cp .env.example .env && 编辑 .env && docker compose up -d

name: lm

services:
  redis:
    image: redis:7.2
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lm}
      MYSQL_USER: ${MYSQL_USER:-lm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 中设置 MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  manager:
    build:
      context: ..
      dockerfile: deploy/docker/manager.Dockerfile
    image: lm-manager
    restart: unless-stopped
    # host 网络：Manager 看到的上报对端 IP 就是 Worker 的真实地址（Worker 地址 = 对端 IP + 50052）
    network_mode: host
    environment:
      LM_REDIS_URI: tcp://127.0.0.1:${REDIS_PORT:-6379}
      LM_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  mysql-data:

# Manager 侧服务编排：Redis、MySQL、manager、nginx（看板）；ai 在后续里程碑加入。
# 用法：cp .env.example .env && 编辑 .env && docker compose up -d

name: lm

services:
  redis:
    image: redis:7.2
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 deploy/.env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lm}
      MYSQL_USER: ${MYSQL_USER:-lm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 中设置 MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  manager:
    build:
      context: ..
      dockerfile: deploy/docker/manager.Dockerfile
    image: lm-manager
    restart: unless-stopped
    # host 网络：Manager 看到的上报对端 IP 就是 Worker 的真实地址（Worker 地址 = 对端 IP + 50052）
    network_mode: host
    environment:
      LM_REDIS_URI: tcp://127.0.0.1:${REDIS_PORT:-6379}
      LM_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}
      # MySQL 冷数据（M7）：端口已映射到宿主；MySQL 不可用时 Manager 照常调度，恢复后自动重连
      LM_MYSQL_HOST: 127.0.0.1
      LM_MYSQL_PORT: ${MYSQL_PORT:-3306}
      LM_MYSQL_USER: ${MYSQL_USER:-lm}
      LM_MYSQL_DATABASE: ${MYSQL_DATABASE:-lm}
      LM_MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 deploy/.env 中设置 MYSQL_PASSWORD}
      # 看板接口 token（M7），为空时不鉴权
      LM_API_TOKEN: ${API_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy

  # 看板与统一入口（M7）：host 网络，经 127.0.0.1:8080 反代 Manager
  nginx:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    image: lm-web
    restart: unless-stopped
    network_mode: host
    environment:
      HTTP_PORT: ${HTTP_PORT:-80}
      MANAGER_HTTP: 127.0.0.1:8080
    depends_on:
      - manager

volumes:
  redis-data:
  mysql-data:

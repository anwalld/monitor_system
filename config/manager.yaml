# Manager 配置样例
listen: 0.0.0.0:50051          # gRPC 监听地址
worker_port: 50052             # Worker gRPC 端口，与上报对端 IP 拼成 Worker 地址
log_level: info
storage:
  queue_capacity: 4096         # 存储队列容量，满时丢最旧
redis:
  uri: tcp://127.0.0.1:6379    # 密码从环境变量 LM_REDIS_PASSWORD 读取
  ts_retention_s: 3600         # node:{id}:ts 保留时长
scoring:                       # 评分与剔除（M5），缺省值即开发文档“默认参数”表
  missing_score: 0.3           # 没有调度延迟或没有网卡数据时该项的分数
  lost_after_ms: 3000          # 超过该时间没有上报视为失联，不参与选择
  evict_after: 3               # 关键指标连续越过剔除线的次数
  recover_after: 5             # 剔除后连续回到恢复线以内的次数
  immediate_factor: 10         # 越过剔除线该倍数时立即剔除
  cpu:  {good: 0.2, bad: 0.9,  evict: 0.97,  recover: 0.85, weight: 0.3}
  runq: {good: 100, bad: 2000, evict: 20000, recover: 5000, weight: 0.3}  # P99 微秒，取对数映射
  mem:  {good: 0.5, bad: 0.1,  evict: 0.05,  recover: 0.1,  weight: 0.2}  # 可用内存比例
  net:                         # 每块网卡取三项最小值，节点取最好的网卡
    weight: 0.2
    rtt_ms:  {good: 5, bad: 100}
    timeout: {good: 0, bad: 0.1}
    retrans: {good: 0, bad: 0.05}
    evict: 0.5                 # 所有网卡超时率都 ≥ 0.5 时越线
    recover: 0.2
inflight:                      # 在途任务账（M5）
  ack_timeout_s: 30            # 分配或 MarkSent 后多久没收到 RECEIVED 算确认超时
  exec_timeout_s: 300          # RECEIVED 后多久没收到 DONE/FAILED 算执行超时
  lambda: 0.5                  # f_timeout = exp(−lambda × T)
  timeout_half_life_s: 600     # 超时计数 T 的半衰期
  baseline_tau_s: 60           # 在途基线指数平滑的时间常数
  base_tasks_floor: 2          # 在途任务数基线下限
  base_bytes_floor: 1048576    # 在途字节数基线下限
breaker:                       # 节点状态机（M6）：慢启动、剔除、急救、低频探测
  slow_start_s: 300            # 慢启动时长，权重从 slow_start_from 线性升到 1
  slow_start_from: 0.2
  recover_reports: 5           # 剔除后连续多少条正常上报才恢复
  probe_interval_ms: 1000      # 低频探测（WorkerTask.Probe）周期
  probe_timeout_ms: 500
  probe_fail_evict: 3          # 连续探测失败次数达到即剔除
  gray_window_s: 300           # 未确认比例的统计窗口
  gray_min_samples: 20
  gray_factor: 3               # 节点未确认比例 > gray_factor × 全体比例
  gray_min_ratio: 0.2          # 且不小于该值才算灰色故障
  rescue:
    min_score: 0.6             # 分数低于此值不急救
    prob_factor: 0.5           # 选中概率 < prob_factor / N 才急救
    interval_ms: 1             # 急救请求间隔
    timeout_ms: 10             # 单条请求超时
    batch_ms: 100              # 每批结算间隔
    max_s: 10                  # 急救最长时长
    t_decay: 0.9               # 成功批 T 乘以该值
    epsilon_factor: 0.125      # 失败时目标下调步长 ε = epsilon_factor / N
    backoff_min_s: 300         # 急救退避 5、10、20 … 分钟
    backoff_max_s: 3600
    backoff_half_life_s: 86400 # 退避级别的半衰期

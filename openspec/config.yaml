schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  ## 项目定位
  Linux 服务器性能监控与调度系统（二次开发，按新开发文档从头重构，旧 worker/manager/proto 代码将被替换）。
  开发文档（权威来源）：https://claude.ai/artifact/7gFfa9w6pxbuwo7WM1EYhN
  四部分：Worker 采集节点指标并执行任务；Manager 评分并把每个任务派给此刻最合适的节点；
  AI 服务做异常诊断、运维问答、负载预测和日报；Web 看板实时展示。

  ## 核心目标
  - 把任务派给当前最闲的节点，节点上他人直接登录跑的负载也要看得到。
  - 故障节点 3 秒内隔离，恢复后自动慢启动重新接任务。
  - CPU 读取耗时比 /proc/stat 低 85% 以上，撑得住 1ms 级急救探测。
  - AI 只给建议：AI 服务整个挂掉，调度照常运行。Redis、MySQL、AI、看板都在旁路，挂掉不影响任务分配。

  ## 非目标
  按业务组切换出口网卡、Manager 高可用（单实例）、认证与多租户（只用静态 token）、容器化 Worker。

  ## 运行环境
  - Manager 侧 1 台 4C8G 虚拟机：Docker Compose 跑 manager、redis、mysql、ai、nginx。
  - Worker 十几台（上限 20，初期 3 台），2–4 核、2 块网卡、Ubuntu 24.04（内核 6.8，开 BTF 与 NO_HZ），
    systemd 部署，能力 CAP_NET_RAW、CAP_BPF、CAP_PERFMON。
  - 规模小：单 Manager，每次选择直接遍历全部候选节点，不做分片或索引。

  ## 目标目录结构（单仓库）
  proto/（monitor.proto、task.proto、advisor.proto）；kmod/cpustat/；bpf/；common/（环形缓冲、seqlock 读端、配置、日志）；
  worker/{collector,netprobe,reporter,task}/；manager/{ingest,scoring,inflight,breaker,storage,api}/；
  ai/（Python）；web/（Vue 3）；deploy/；experiments/。

  ## 技术选型
  - 内核模块：C，Linux 6.8，字符设备 + vmalloc_user 共享页 + hrtimer + seqlock，MODULE_LICENSE("GPL")。
  - eBPF：libbpf + CO-RE，bpftool 生成 skeleton，tp_btf 跟踪点。
  - Worker/Manager：C++17、CMake、gRPC + Protobuf（package lm）、spdlog、yaml-cpp、GoogleTest；
    Manager 另用 redis-plus-plus、MySQL Connector/C++、Drogon（REST + WebSocket）。
  - AI：Python 3.11、FastAPI、redis-py、aiomysql、grpcio、pydantic、openai SDK（OpenAI 兼容接口）、mcp SDK、APScheduler、numpy。
  - 看板：Vue 3 + Vite + ECharts。
  - 端口：Manager gRPC 50051、HTTP 8080；Worker gRPC 50052；AI 8000；Nginx 80（/api/ai/→AI，/api/ 与 /ws→Manager，/→看板）。
  - 配置：每组件一个 YAML；LLM API Key、数据库密码放 .env，不进 Git。

  ## 关键工程约束
  - Manager 调度状态（节点表、在途账）由一把互斥锁保护，持锁期间不做任何 IO；Redis/MySQL 写入交给存储线程，写失败只记日志。
  - Worker 上报 1 秒一次、RPC 超时 500ms、失败不重传；采集与上报通过 CAS 环形缓冲解耦。
  - proto 字段号一经发布不得复用或修改；optional 字段用 has_xxx() 区分“未上报”和 0。
  - 代码风格 Google C++ Style（.clang-format），命名空间 lm；注释可用中文。
  - 新增源文件同步加入对应 CMakeLists.txt；单元测试用 GoogleTest，并发代码开 ThreadSanitizer。

  ## 开发环境注意事项
  - 开发机是 macOS（CLion），内核模块、eBPF、/proc、策略路由、ICMP 原始 socket 只能在 Linux Worker 虚拟机上编译和验证；
    任务与验收中必须标明哪些步骤需在 Linux 上执行。
  - 里程碑 M0–M10 按依赖推进，每个里程碑一个 OpenSpec change，结束时都能跑起来。

rules:
  proposal:
    - 标明对应的里程碑（M0–M10）和影响的模块（proto / kmod / bpf / common / worker / manager / ai / web / deploy / experiments）
    - 明确写出不在本次范围内的内容，尤其是留给后续里程碑的部分
    - 涉及 proto、Redis key 或 MySQL 表结构时，说明兼容性
  design:
    - 跨进程改动描述数据流和线程归属
    - 说明对采集开销、上报频率、Redis/MySQL 写入量、调度锁持有时间的影响
  tasks:
    - 每个任务粒度控制在 2 小时以内
    - 按依赖顺序排列（proto → common → worker → manager → 存储 → ai → web → 部署 → 实验）
    - 每组任务末尾包含构建与验证步骤，标注需在 Linux 上执行的部分
    - 验收标准与开发文档里程碑表一致
  specs:
    - 每个 Requirement 至少一个 Scenario，使用 WHEN/THEN
    - gRPC 接口写明请求参数、返回字段与错误码；阈值和默认参数写出具体数值

operations:
  apply:
    guidance:
      - 遵循开发文档与本 change 的 design，不做范围外的重构
      - 能在 macOS 上构建的部分本地构建验证；需 Linux 的部分如实说明并给出验证命令
  archive:
    guidance:
      - 归档前确认 README、配置样例与实现一致
